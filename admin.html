<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | Manbazar-I Development Block</title><link rel="stylesheet" href="style.css">
<style>
body{background:#fff8f6}.wrap{max-width:980px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #ead9d5;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 4px 18px rgba(80,20,30,.06)}
h1,h2{color:#7b0f26}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700;display:block;margin:8px 0 6px}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfc2be;border-radius:8px;font-size:15px}textarea{min-height:130px}
button{background:#7b0f26;color:#fff;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:700;margin-top:12px}.secondary{background:#555}.danger{background:#a22}
.notice{border:1px solid #ead9d5;padding:14px;border-radius:10px;margin:10px 0}.status{padding:10px;border-radius:8px;background:#f5eeee;margin-top:12px}.hidden{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Admin Panel</h1><p>Manbazar-I Development Block — Notice Management</p>
<div id="loginCard" class="card"><h2>Admin Login</h2>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">Login</button><div id="loginMsg" class="status"></div></div>
<div id="panel" class="hidden">
<div class="card"><button id="logoutBtn" class="secondary">Logout</button><h2>Publish New Notice</h2>
<form id="noticeForm"><div class="grid">
<div><label>Notice title</label><input id="title" required></div>
<div><label>Date</label><input id="date" type="date" required></div>
<div><label>Category</label><select id="category"><option>Notice</option><option>Tender</option><option>Recruitment</option><option>Scheme</option><option>Order</option></select></div>
<div><label>PDF / document URL (optional)</label><input id="pdfUrl" type="url" placeholder="https://..."></div>
</div><label>Notice details</label><textarea id="details" required></textarea>
<button type="submit">Publish Notice</button><div id="publishMsg" class="status"></div></form></div>
<div class="card"><h2>Published Notices</h2><div id="noticeList">Loading...</div></div>
</div></div><script type="module" src="admin.js"></script></body></html>
